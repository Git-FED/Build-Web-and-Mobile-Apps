<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="color-scheme" content="dark" />
    <title>Offline — My Web App</title>
    <style>
      :root {
        --bg: #0b1020;
        --fg: #e8ecf4;
        --muted: #8b95ad;
        --accent: #4f8cff;
        --card: rgba(255, 255, 255, 0.04);
        --border: rgba(255, 255, 255, 0.08);
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1000px 500px at 50% -10%, #1a2342 0%, var(--bg) 55%) fixed;
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(var(--safe-top) + 24px) 24px calc(var(--safe-bottom) + 24px);
      }
      .card {
        max-width: 420px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px 28px;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 22px;
        margin: 8px 0;
      }
      p {
        color: var(--muted);
        margin: 8px 0 20px;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
    <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        There's no internet connection right now. Any content you've already visited is still
        available from the cache.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
